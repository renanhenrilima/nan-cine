# Publica o Nan Cine no GitHub Pages (grátis) e renova as notas do IMDb todo dia.
#
# Antes da primeira publicação, no repositório do GitHub:
#   1. Settings › Pages › Source: "GitHub Actions"
#   2. Settings › Secrets and variables › Actions › New repository secret
#        TMDB_KEY = sua chave do TMDB   (obrigatório para o catálogo ao vivo)
#        OMDB_KEY = sua chave do OMDb   (notas dos críticos; fica só no GitHub, não vai para o site)

name: Publicar Nan Cine

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *' # todo dia às 04h17 de Brasília
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Se o IMDb estiver fora do ar, segue com as notas que já estão no repositório.
      - name: Atualizar notas do IMDb
        run: node ferramentas/atualizar-imdb.mjs
        continue-on-error: true

      # Vencedores de prêmios (Wikidata + TMDB). Se falhar, segue com a lista que já está no repositório.
      - name: Atualizar vencedores de prêmios
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node ferramentas/atualizar-premios.mjs
        continue-on-error: true

      # Notas dos críticos (OMDb). A cota gratuita é de 1.000 consultas por dia, então só as
      # execuções diárias e manuais consultam; as demais apenas guardam o que já foi reunido.
      - name: Atualizar notas dos críticos
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          CRITICOS_MAX: ${{ github.event_name == 'push' && '0' || '900' }}
        run: node ferramentas/atualizar-criticos.mjs
        continue-on-error: true

      - name: Gravar chaves
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node ferramentas/gravar-chaves.mjs

      - name: Montar a pasta do site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js img dados _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: pages
        uses: actions/deploy-pages@v4
